################################################################################
# MQ Configuration File
# Place in current directory or ~/.config/mq/mq.toml
################################################################################

[command_line_defaults]
# These set defaults for common command-line arguments (that can still be overridden explicity)
name = "python-code-quality"
path = "."
level = "1"
log_level = "DEBUG" # Default log level, ie. DEBUG, INFO, WARNING, ERROR, CRITICAL

# Optional: log file location
# file = "/var/log/mq/mq.log"

# Optional: log format
# format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

[tools]
# Tool-specific settings
# results_required = true

[database]
# Database configuration (if applicable)
# path = "~/.local/share/mq/mq.db"
