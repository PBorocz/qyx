[project]
name = "pcq"
version = "0.1.0"
description = "Python Code Quality Data Warehouse"
readme = "README.md"
requires-python = ">=3.11.9"
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = [
    "argman>=0.3.3,<4.0",
    "rich>=14.2.0",
]

[project.scripts]
pcq = "pcq.__main__:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poe]
verbosity = 0

[tool.poe.tasks.dbm]
cmd = "dbmate --migrations-dir ./src/pcq/models/migrations/ --env DB_RDB --no-dump-schema"
help = "Run arbitrary dbmate on the local development database"

[tool.poe.tasks.flush]
cmd = "uv run pcq flush"
help = "Flush the database entirely"

#-------------------------------------------------------------------------------
# all
#-------------------------------------------------------------------------------
[tool.poe.tasks.ingest]
shell = """
  poe cloc
  poe ruff
  """
help = "Run/ingest all modules."

[tool.poe.tasks.report]
shell = """
  poe cloc-report
  poe ruff-report
  """
help = "Report all modules."

#-------------------------------------------------------------------------------
# cloc
#-------------------------------------------------------------------------------
[tool.poe.tasks.cloc]
shell = """
  cloc --include-lang=Python src/ --by-file --json | uv run pcq ingest --module cloc
  """
help = "Run cloc and report on results."

[tool.poe.tasks.cloc-report]
cmd = "uv run pcq report --module cloc"
help = "Report on most recent cloc run"

#-------------------------------------------------------------------------------
# Ruff - Check
#-------------------------------------------------------------------------------
[tool.poe.tasks.ruff]
shell = """
  ruff check --output-format=json | uv run pcq ingest --module ruff
  """
help = "Run current ruff check and report on results."

[tool.poe.tasks.ruff-report]
cmd = "uv run pcq report --module ruff"
help = "Report on most recent ruff run"

[tool.poe.tasks.sql]
envfile = ".env"
shell = """
  echo ${DB_RDB}
  litecli ${DB_RDB}
"""
help = "Run litecli against our database"
