[project]
name = "qyx"
version = "0.2.3"
description = "Python Code Quality Data Warehouse"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.11.9"
authors = [{name = "Peter Borocz", email = "peter.borocz+qyx@gmail.com"}]
keywords = ["code-quality", "metrics", "static-analysis", "python", "dashboard"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",  # adjust to your LICENSE file
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "bottle>=0.13.4",
    "jinja2>=3.1.6",
    "peewee>=3.18.3",
    "platformdirs>=4.5.1",
    "plotly>=6.5.2",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=14.2.0",
    "rich-argparse>=1.7.2",
]

[project.urls]
Homepage = "https://github.com/PBorocz/qyx"
Repository = "https://github.com/PBorocz/qyx"
Issues = "https://github.com/PBorocz/qyx/issues"

[project.scripts]
qyx = "qyx.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "waitress>=3.0.2",
]

#-------------------------------------------------------------------------------
# POE Configuration and tasks:
#-------------------------------------------------------------------------------
[tool.poe]
verbosity = -1

#-------------------------------------------------------------------------------
# Ingest examples:
#-------------------------------------------------------------------------------
# poe qyx ingest --name python-code-quality       --path "."                                          --log-level debug
# poe qyx ingest --name python-code-quality       --path https://github.com/PBorocz/qyx.git           --log-level debug
# poe qyx ingest --name optimus_ludos             --path https://github.com/PBorocz/optimus_ludos.git --log-level debug
# poe qyx ingest --tool ruff --name optimus_ludos --path https://github.com/PBorocz/optimus_ludos.git --log-level debug
#-------------------------------------------------------------------------------
# Direct JSON ingestion examples
# cloc --include-lang=Python src/ --by-file --json | uv run qyx ingest --tool cloc --stdin --name python-code-quality --path "." --analysis cloc
# ruff check --output-format=json                  | uv run qyx ingest --tool cloc --stdin --name python-code-quality --path "." --analysis ruff
# uvx radon cc  . --json                           | uv run qyx ingest --tool cloc --stdin --name python-code-quality --path "." --analysis radon:cc
# uvx radon hal . --json                           | uv run qyx ingest --tool cloc --stdin --name python-code-quality --path "." --analysis radon:hal
# uvx radon mi  . --json                           | uv run qyx ingest --tool cloc --stdin --name python-code-quality --path "." --analysis radon:mi
# uvx radon raw . --json                           | uv run qyx ingest --tool cloc --stdin --name python-code-quality --path "." --analysis radon:raw
#-------------------------------------------------------------------------------

#-------------------------------------------------------------------------------
# Admin support
#-------------------------------------------------------------------------------

[tool.poe.tasks.qyx]
help = "Run the qyx command"
cmd = "uv run qyx"

[tool.poe.tasks.status]
help = "Report current status"
cmd = "uv run qyx status"

[tool.poe.tasks.serve]
help = "Run the qyx command"
cmd = "uv run qyx serve"

[tool.poe.tasks.report]
help = "Display summary report across all modules"
cmd = """uv run qyx report"""

[tool.poe.tasks.housekeeping]
help = "Run housekeeping cleanse on the database"
cmd = "uv run qyx admin clean"

[tool.poe.tasks.sql]
help = "Run litecli for interactive db querying (note that db path is for Mac)"
cmd = "litecli \"~/Library/Application Support/qyx/db.sqlite3\""


#-----------------------------------------------------------------------------------------------
# Development support
#-----------------------------------------------------------------------------------------------
[tool.poe.tasks.push]
help = "Push to github (NOTE: I use jujutsu & fish shell..YMMV!)"
interpreter = "fish"
shell = """
  uvx cleanpy --all --exclude-envs --verbose .
  ruff rule   --all --output-format json > src/qyx/tools/ruff/ruff_rules.json
  if not jj diff --quiet
    jj describe -m "chore: update ruff rules database [automated]"
  end
  jj bookmark set trunk --revision 'coalesce(@-, @)'
  jj git push --bookmark trunk

  uv run qyx ingest --name QYX --path https://github.com/PBorocz/qyx.git
  """

[tool.poe.tasks.build]
help = "Build package for distribution"
interpreter = "fish"
shell = """
  uvx cleanpy --all --exclude-envs --verbose .
  uv build
  """

[tool.poe.tasks.publish_test]
help = "Release package to testpypi for distribution"
interpreter = "fish"
shell = """
  uvx twine upload --repository testpypi dist/*
  """
