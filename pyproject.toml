[project]
name = "mq"
version = "0.1.0"
description = "Python Code Quality Data Warehouse"
readme = "README.md"
requires-python = ">=3.11.9"
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = [
    "peewee>=3.18.3",
    "platformdirs>=4.5.1",
    "python-fasthtml>=0.12.36",
    "rich>=14.2.0",
]

[project.scripts]
mq = "mq.__main__:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poe]
verbosity = -1

[tool.poe.tasks.Deploy]
help = "Deploy to github."
interpreter = "fish"
shell = """
  uvx cleanpy --verbose
  jj bookmark set --revision  @- trunk
  jj git push     --revisions @-
  """

[tool.poe.tasks.mq]
cmd = "uv run mq"
help = "Run the mq command."

#-------------------------------------------------------------------------------
# all
#-------------------------------------------------------------------------------
[tool.poe.tasks.ingest]
cmd = """uv run mq ingest"""
help = "Run/ingest all modules."

[tool.poe.tasks.report]
cmd = """uv run mq report"""
help = "Display summary report across all modules."

#-------------------------------------------------------------------------------
# Radon
#-------------------------------------------------------------------------------
[tool.poe.tasks.radon]
shell = """
  uvx radon cc  . --json | uv run mq ingest --module radon --submodule cc
  uvx radon hal . --json | uv run mq ingest --module radon --submodule hal
  uvx radon mi  . --json | uv run mq ingest --module radon --submodule mi
  uvx radon raw . --json | uv run mq ingest --module radon --submodule raw
  """
help = "Ingest radon checks"

#-------------------------------------------------------------------------------
# Cloc
#-------------------------------------------------------------------------------
[tool.poe.tasks.cloc]
shell = """
  cloc --include-lang=Python src/ --by-file --json | uv run mq ingest --module clocw
  """
help = "Run cloc and report on results."

#-------------------------------------------------------------------------------
# Ruff (Check)
#-------------------------------------------------------------------------------
[tool.poe.tasks.ruff]
shell = """
  ruff check --output-format=json | uv run mq ingest --module ruff
  """
help = "Run current ruff check and report on results."

[tool.poe.tasks.clear]
cmd = "uv run mq clear"
help = "Clear the database entirely(!)."

[tool.poe.tasks.trim]
cmd = "uv run mq trim"
help = "Delete -old- runs from the database, leaving the most recent."

[tool.poe.tasks.sql]
cmd = "litecli \"~/Library/Application Support/mq/mq.sqlite3\""
help = "Run the litecli command against our database"

#-------------------------------------------------------------------------------
# test
#-------------------------------------------------------------------------------
[tool.poe.tasks.test_suite_reports]
shell = """
  set -e
  uv run mq
  uv run mq status

  uv run mq report --module cloc
  uv run mq report --module cloc --level summary
  uv run mq report --module cloc --level summary --options percentage
  uv run mq report --module cloc --level detail
  uv run mq report --module cloc --level detail --options percentage
  uv run mq report --module cloc --level full
  uv run mq report --module cloc --level full --options percentage
  uv run mq report --module cloc --level history

  uv run mq report --module ruff
  uv run mq report --module ruff --level summary
  uv run mq report --module ruff --level detail
  uv run mq report --module ruff --level full
  uv run mq report --module ruff --level history

  uv run mq report --module radon
  uv run mq report --module radon --level summary
  uv run mq report --module radon --level detail
  uv run mq report --module radon --level full
  # uv run mq report --module radon --level history

  uv run mq report --module radon --sub_module cc
  uv run mq report --module radon --sub_module cc --level summary
  uv run mq report --module radon --sub_module cc --level detail
  uv run mq report --module radon --sub_module cc --level full
  # uv run mq report --module radon --sub_module cc --level history

  uv run mq report --module radon --sub_module hal
  uv run mq report --module radon --sub_module hal --level summary
  uv run mq report --module radon --sub_module hal --level detail
  uv run mq report --module radon --sub_module hal --level full
  # uv run mq report --module radon --sub_module hal --level history

  uv run mq report --module radon --sub_module mi
  uv run mq report --module radon --sub_module mi --level summary
  uv run mq report --module radon --sub_module mi --level detail
  uv run mq report --module radon --sub_module mi --level full
  uv run mq report --module radon --sub_module mi --level history

  uv run mq report --module radon --sub_module raw
  uv run mq report --module radon --sub_module raw --level summary
  uv run mq report --module radon --sub_module raw --level detail
  uv run mq report --module radon --sub_module raw --level full
  # uv run mq report --module radon --sub_module raw --level history
"""
help = "Run smoke test suite"
