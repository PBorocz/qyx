[project]
name = "mq"
version = "0.1.0"
description = "Python Code Quality Data Warehouse"
readme = "README.md"
requires-python = ">=3.11.9"
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = [
    "loguru>=0.7.3",
    "peewee>=3.18.3",
    "rich>=14.2.0",
]

[project.scripts]
mq = "mq.__main__:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poe]
verbosity = 0

[tool.poe.tasks.dbm]
cmd = "dbmate --migrations-dir ./src/mq/models/migrations/ --env DB_RDB --no-dump-schema"
help = "Run arbitrary dbmate on the local development database"

[tool.poe.tasks.flush]
cmd = "uv run mq flush"
help = "Flush the database entirely."

[tool.poe.tasks.purge]
cmd = "uv run mq purge"
help = "Purge old runs from the database."

[tool.poe.tasks.sql]
envfile = ".env"
shell = """
  echo ${DB_RDB}
  litecli ${DB_RDB}
"""
help = "Run litecli against our database."

#-------------------------------------------------------------------------------
# all
#-------------------------------------------------------------------------------
[tool.poe.tasks.ingest]
shell = """
  poe cloc
  poe ruff
  poe radon
  """
help = "Run/ingest all modules."

[tool.poe.tasks.report]
shell = """
  poe cloc-report
  poe ruff-report
  poe radon-report
  """
help = "Report all modules."

#-------------------------------------------------------------------------------
# Radon
#-------------------------------------------------------------------------------
[tool.poe.tasks.radon]
shell = """
  uvx radon cc  . --json | uv run mq ingest --module radon --submodule cc
  uvx radon hal . --json | uv run mq ingest --module radon --submodule hal
  uvx radon mi  . --json | uv run mq ingest --module radon --submodule mi
  uvx radon raw . --json | uv run mq ingest --module radon --submodule raw
  """
help = "Ingest radon checks"

[tool.poe.tasks.radon-report]
cmd = "uv run mq report --module radon"
help = "Report on most recent radon run"

#-------------------------------------------------------------------------------
# Cloc
#-------------------------------------------------------------------------------
[tool.poe.tasks.cloc]
shell = """
  cloc --include-lang=Python src/ --by-file --json | uv run mq ingest --module cloc
  """
help = "Run cloc and report on results."

[tool.poe.tasks.cloc-report]
cmd = "uv run mq report --module cloc"
help = "Report on most recent cloc run"

#-------------------------------------------------------------------------------
# Ruff (Check)
#-------------------------------------------------------------------------------
[tool.poe.tasks.ruff]
shell = """
  ruff check --output-format=json | uv run mq ingest --module ruff
  """
help = "Run current ruff check and report on results."

[tool.poe.tasks.ruff-report]
cmd = "uv run mq report --module ruff"
help = "Report on most recent ruff run"
