[project]
name = "mq"
version = "0.1.0"
description = "Python Code Quality Data Warehouse"
readme = "README.md"
requires-python = ">=3.11.9"
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = [
    "peewee>=3.18.3",
    "platformdirs>=4.5.1",
    "pygal>=3.1.0",
    "python-fasthtml>=0.12.36",
    "rich>=14.2.0",
]

[project.scripts]
mq = "mq.__main__:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poe]
verbosity = -1

[tool.poe.tasks.Deploy]
help = "Deploy to github."
interpreter = "fish"
shell = """
  uvx cleanpy --all --exclude-envs --verbose .
  ruff rule --all --output-format json > src/mq/tools/ruff/ruff_rules.json
  if not jj diff --quiet
    jj describe -m "chore: update ruff rules database [automated]"
  end
  # jj bookmark set trunk --revision @-
  jj bookmark set trunk --revision 'coalesce(@-, @)'
  jj git push --bookmark trunk
  """

[tool.poe.tasks.mq]
cmd = "uv run mq"
help = "Run the mq command"

[tool.poe.tasks.status]
cmd = "uv run mq status"
help = "Report current status"

#-------------------------------------------------------------------------------
# all
#-------------------------------------------------------------------------------
[tool.poe.tasks.ingest]
cmd = """uv run mq ingest"""
help = "Run/ingest all modules."

[tool.poe.tasks.ingest-git]
shell = """
  # uv run mq admin clear --no_confirm
  poe mq ingest --git https://github.com/pborocz/mq
  # uv run mq report      --analysis cloc --project https://github.com/pborocz/mq --level h --options "last:99"
  """
help = "Run/ingest all modules."

[tool.poe.tasks.report]
cmd = """uv run mq report"""
help = "Display summary report across all modules."

#-------------------------------------------------------------------------------
# Radon
#-------------------------------------------------------------------------------
[tool.poe.tasks.radon]
shell = """
  uvx radon cc  . --json | uv run mq ingest --stdin --analysis radon:cc
  uvx radon hal . --json | uv run mq ingest --stdin --analysis radon:hal
  uvx radon mi  . --json | uv run mq ingest --stdin --analysis radon:mi
  uvx radon raw . --json | uv run mq ingest --stdin --analysis radon:raw
  """
help = "Ingest radon checks"

#-------------------------------------------------------------------------------
# Cloc
#-------------------------------------------------------------------------------
[tool.poe.tasks.cloc]
shell = """cloc --include-lang=Python src/ --by-file --json | uv run mq ingest --analysis cloc"""
help = "Run cloc and report on results."

#-------------------------------------------------------------------------------
# Ruff (Check)
#-------------------------------------------------------------------------------
[tool.poe.tasks.ruff]
shell = """ruff check --output-format=json | uv run mq ingest --analysis ruff"""
help = "Run current ruff check and report on results."

[tool.poe.tasks.clear]
cmd = "uv run mq admin clear"
help = "Clear the database entirely(!)."

[tool.poe.tasks.trim]
cmd = "uv run mq admin trim"
help = "Delete -old- runs from the database, leaving the most recent."

[tool.poe.tasks.sql]
cmd = "litecli \"~/Library/Application Support/mq/mq.sqlite3\""
help = "Run the litecli command against our database"

#-------------------------------------------------------------------------------
# Tests
#-------------------------------------------------------------------------------
[tool.poe.tasks.test_suite_reports]
shell = """
  set -e
  uv run mq
  uv run mq status

  uv run mq report --analysis cloc
  uv run mq report --analysis cloc --level 0
  uv run mq report --analysis cloc --level 0 --options percentage
  uv run mq report --analysis cloc --level 1
  uv run mq report --analysis cloc --level 1 --options percentage
  uv run mq report --analysis cloc --level 2
  uv run mq report --analysis cloc --level 2 --options percentage
  uv run mq report --analysis cloc --level h

  uv run mq report --analysis fxtd
  uv run mq report --analysis fxtd --level 0
  uv run mq report --analysis fxtd --level 1
  uv run mq report --analysis fxtd --level 2
  uv run mq report --analysis fxtd --level h
  uv run mq report --analysis fxtd --level h --options last:4

  uv run mq report --analysis ruff
  uv run mq report --analysis ruff --level 0
  uv run mq report --analysis ruff --level 1
  uv run mq report --analysis ruff --level 2
  uv run mq report --analysis ruff --level h
  uv run mq report --analysis ruff --level h --options last:4

  uv run mq report --analysis radon
  uv run mq report --analysis radon --level 0
  uv run mq report --analysis radon --level 1
  uv run mq report --analysis radon --level 2
  uv run mq report --analysis radon --level h
  uv run mq report --analysis radon --level h --options last:4

  uv run mq report --analysis radon:mi
  uv run mq report --analysis radon:mi --level 0
  uv run mq report --analysis radon:mi --level 1
  uv run mq report --analysis radon:mi --level 2
  uv run mq report --analysis radon:mi --level h
  uv run mq report --analysis radon:mi --level h --options last:4

  uv run mq report --analysis radon:raw
  uv run mq report --analysis radon:raw --level 0
  uv run mq report --analysis radon:raw --level 1
  uv run mq report --analysis radon:raw --level 2
  uv run mq report --analysis radon:raw --level h
  uv run mq report --analysis radon:raw --level h --options last:4

  uv run mq report --analysis radon:cc
  uv run mq report --analysis radon:cc --level 0
  uv run mq report --analysis radon:cc --level 1
  uv run mq report --analysis radon:cc --level 2
  uv run mq report --analysis radon:cc --level 3
  uv run mq report --analysis radon:cc --level h
  uv run mq report --analysis radon:cc --level h --options last:4

  uv run mq report --analysis radon:hal
  uv run mq report --analysis radon:hal --level 0
  uv run mq report --analysis radon:hal --level 1
  uv run mq report --analysis radon:hal --level 2
  uv run mq report --analysis radon:hal --level 3
  uv run mq report --analysis radon:hal --level h
  uv run mq report --analysis radon:hal --level h --options last:4
"""
help = "Run smoke test suite"
