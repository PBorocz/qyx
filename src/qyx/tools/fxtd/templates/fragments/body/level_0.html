<table>
  <thead>
    <tr>
      <th scope="col" style="text-align: left">Type</th>
      <th scope="col" style="text-align: right">Count</th>
    </tr>
  </thead>
  <tbody>
    {% for result in level_0.results %}
    <tr>
      <td style="text-align: left">{{ result.type }}</td>
      <td style="text-align: right">{{ "{:,d}".format(result.count) }}</td>
    </tr>
    {% endfor %}
  </tbody>
  {% if level_0.grand_total %}
  <tfoot>
    <tr>
      <td style="text-align: left">TOTAL</td>
      <td style="text-align: right">{{ "{:,d}".format(level_0.grand_total) }}</td>
    </tr>
  </tfoot>
  {% endif  %}

</table>
