<table id="level_1" class="striped">
  <thead>
    <tr>
      <th scope="col" style="text-align: left">Type</th>
      <th scope="col" style="text-align: left">Directory</th>
      <th scope="col" style="text-align: right">Count</th>
    </tr>
  </thead>
  <tbody>
    {% for row in fxtd_1.rows %}
    <tr>
      <td style="text-align: left">{{ row.type }}</td>
      <td style="text-align: left">{{ row.directory }}</td>
      <td style="text-align: right">{{ "{:,d}".format(row.count) }}</td>
    </tr>
    {% endfor %}
  </tbody>
  {% if fxtd_1.grand_total %}
  <tfoot>
    <tr>
      <td style="text-align: left">TOTAL</td>
      <td style="text-align: right">{{ "{:,d}".format(fxtd_1.grand_total) }}</td>
      <td style="text-align: right"></td>
    </tr>
  </tfoot>
  {% endif %}
</table>
<script>new Tablesort(document.getElementById('level_1'));</script>
