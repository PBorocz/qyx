<table id="level_2" class="striped">
  <thead>
    <tr>
      <th scope="col" style="text-align: center">Type</th>
      <th scope="col" style="text-align: left">File [line]</th>
      <th scope="col" style="text-align: left">Message</th>
    </tr>
  </thead>
  <tbody>
    {% for row in fxtd_2.rows %}
    <tr>
      <td style="text-align: center">{{ row.type }}</td>
      <td style="text-align: left">{{ row.directory }}/{{ row.filename }} [{{ row.line}}]</td>
      <td style="text-align: left">{{ row.message }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

<script>new Tablesort(document.getElementById('level_2'));</script>
