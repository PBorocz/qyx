<table id="ruff_1" class="striped">
  <thead>
    <tr>
      <th scope="col" style="text-align: left">Rule</th>
      <th scope="col" style="text-align: right">Count</th>
      <th scope="col" style="text-align: left">Message</th>
    </tr>
  </thead>
  <tbody>
    {% for result in ruff_1.results %}
    <tr>
      <td style="text-align: left">{{ result.rule_code }}</td>
      <td style="text-align: right">{{ "{:,d}".format(result.count) }}</td>
      <td style="text-align: left">{{ result.rule_name }}</td>
    </tr>
    {% endfor %}
  </tbody>
  {% if ruff_1.results %}
  <tfoot>
    <tr>
      <td style="text-align: left">TOTAL</td>
      <td style="text-align: right">{{ "{:,d}".format(ruff_1.summary.count) }}</td>
      <td style="text-align: right"></td>
    </tr>
  </tfoot>
  {% endif %}
</table>
<script>new Tablesort(document.getElementById('ruff_1'));</script>
